[project]
name = "transit-cal"
version = "0.1.0"
description = "Transit schedules as subscribable calendar feeds"
readme = "README.md"
authors = [{ name = "Eric Case", email = "eric@vedana.net" }]
license = "MIT"
requires-python = ">=3.14"
dependencies = ["icalendar>=7.3"]

[project.scripts]
transit-cal = "transit_cal.cli:main"

[dependency-groups]
dev = ["pytest>=9.1", "ty==0.0.84"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET"]
